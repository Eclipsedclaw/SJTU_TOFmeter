#   (spreadsheet of 2026-11-26 17:46, file written 2026-11-26 17:46).
# Geometry and channels come from the spreadsheet: change them there and run the script again.
# The analysis settings below come from two_layer_2026-11-26.toml; edit them here if needed:
# the script keeps them when it replaces this file. Its TOP view: two_layer_2026-11-26_top_view.png.
#
# Frame: the simulation's (simulation/src/DetectorConstruction.cc), z up, z = 0 the centre plane of the middle layer
# (the simulation has the scintillator centres at z = 70.1 and 40.1 cm). geo_paddle k = simulation bar k (copy
# number k - 1), its centre at first_cm + (k - 1) x pitch_cm across the layer: y for the top layer, x for the middle.
# A ends: at the negative end of each paddle (-x top, -y middle). The top A ends are at the wall (the user,
# 2026-11-26); run 71's channel-map check gives the same for both layers.
# Board offsets: none. In run 71 the boards' clocks agree to ~0.2 ns as recorded; the sync runs of 2026-11-07
# (b2 +4.766, b3 -4.772, b4 +5.056, b5 +4.771 ns) do not hold for these data: neighbouring paddles on two boards
# (P26|P25, P22|P21, P14|P15, P18|P19) differ by -0.10, -0.09, +0.19, -0.17 ns without them, by up to 9.6 ns with
# them. calibrate.py checks this in every run (plot neighbour_times).
# Analysis settings: taken over from the 2026-11-12 setup (tuned on runs 56-59 with its four paddles).

