# Setup of the full two-layer test (2026-11-26, from run 71): nine top and nine middle
# paddles, both ends of each read out, on boards 1-5 (36 channels).
#   channels and geometry: 261126_TOFmeter_mapping.xlsx (SJTU_TOFmeter-work/analysis, version of
#   2026-11-26 16:44 with geo_layer / geo_paddle / geo_side, "connected with sim and reconstruction")
#
# The analysis picks the setup file whose valid_from is the latest on or before a
# run's date, so keep old files and add a new one (with a new valid_from) whenever
# paddles, cables or positions change. Units: cm, ns. Lines after # are comments.

name = "two_layer_2026-11-26"
description = "9 top + 9 middle scintillator paddles with 2 mm gaps, both ends read out, boards 1-5 (36 channels)"
valid_from = 2026-11-26
geometry_source = "mapping sheet 2026-11-26 16:44 (geo_paddle = simulation bar) in the frame of simulation/src/DetectorConstruction.cc: top = station Al1 (bars along x), middle = Al2 (bars along y); paddles 40 x 4 x 0.6 cm, 2 mm between neighbours (4.2 cm apart; the simulation has 4.0 cm), layers 30 cm apart (the user); A ends at the negative end of each paddle (not in the sheet: from run 71's channel-map check); to be replaced by measured values"

# Coordinates: the simulation's frame (DetectorConstruction.cc), z up; z = 0 is the centre plane
# of the middle layer (the simulation has the scintillator centres at z = 70.1 and 40.1 cm).
# geo_paddle k of the sheet = simulation bar k (ScintillatorPhys_Al1_k / _Al2_k, copy number k - 1),
# its centre at -16.8 + 4.2 (k - 1) cm across the layer: y for the top layer, x for the middle one.
# Both layers are centred on x = y = 0. Seen from above:
#
#                                 +y
#                B   B   B   B   B   B   B   B   B          middle B ends (+y)
#     P21 (9)  A ===================================== B    top, along x, y = +16.8
#     P22 (8)  A ===================================== B    y = +12.6
#              :                                       :
#     P29 (1)  A ===================================== B    y = -16.8
#                A   A   A   A   A   A   A   A   A          middle A ends (-y)
#               P12 P13 P14 P15 P16 P17 P18 P19 P20         middle, along y: x = -16.8 ... +16.8
#        -x  <------------------------------------------>  +x
#
# Which end is A is not in the sheet. Run 71's tracks fix it (channel-map check, geometry only):
# through the middle paddle on ch10032/33 (P12, geo 1) the top hits lie towards the top A ends, and
# through the top paddle on ch10010/11 (P29, geo 1) the middle hits lie towards the middle A ends.
# With geo 1 at the negative side of each layer, both A ends are at the negative end (-x, -y).

[[layers]]
name = "top"
z_cm = 30.0

[[layers]]
name = "middle"
z_cm = 0.0

# One [[paddles]] table per paddle:
#   axis       its long direction, "x" or "y"
#   x_cm, y_cm its centre (z_cm too if it is not at its layer's z)
#   A_end      where the end read by channel A sits: "-x" = at negative x, ...
#   channels   DAQ_YY channel ids: 10000 + 10 x board + channel (board 1 channel 0 = 10010)
#   label      the name on the slide or cable, if it differs from name
# length_cm is the scintillator's length: tA - tB spans 2 x length / v_eff.

